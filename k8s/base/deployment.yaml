apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-app
  template:
    metadata:
      labels:
        app: preview-app
    spec:
      containers:
      - name: preview-app
        image: 430695042378.dkr.ecr.us-east-1.amazonaws.com/preview-app:28245970d04ffc085b2c96f5924db5c0f76762c5
        ports:
        - containerPort: 3000