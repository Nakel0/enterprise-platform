apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nakel0/enterprise-platform.git
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true